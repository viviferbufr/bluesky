
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="img/Inicio/nuvem.png">
    <link rel="stylesheet" href="css/style.css">

    <title>Blue Sky | Contato</title>
</head>

<body class="pagina-contato">

    <header class="header">
        <img src="img/Inicio/Logo_blue_sky_recortada.jpg"
             alt="Logo Blue Sky" class="logo">
             
        <nav>
            <a href="index.html"> Início </a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="autocuidado.html">Autocuidado</a>
            <a href="tipos_de_pele.html">Tipos de pele</a>
        </nav>
    </header>

    <main class="contato-container">

        <h2>Vamos conversar?</h2>
        <p>Dúvidas, sugestões ou ideias? Estamos aqui para ouvir você.</p>

        <form id="contato-form">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" minlength="3" pattern=".*\S.*" autocomplete="name" placeholder="Digite seu nome completo" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="exemplo@email.com" required>

            <label for="assunto">Assunto:</label>
            <select id="assunto" name="assunto" required>
                <option value="">Selecione um assunto</option>
                <option value="Dúvida">Dúvida</option>
                <option value="Sugestão">Sugestão</option>
                <option value="Elogio">Elogio</option>
                <option value="Outro">Outro</option>
            </select>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem"
                      rows="5" minlength="10" placeholder="Escreva sua mensagem (mínimo de 10 caracteres)" required></textarea>

            <button type="submit">Enviar mensagem</button>

        </form>

        <p id="aviso" role="status"></p>

        <section class="mensagens">
    
            <h3>Mensagens salvas neste navegador</h3>
            <p>Suas mensagens serão exibidas aqui após serem enviadas.</p>
            <div id="listaMensagens"></div>
        </section>

    </main>

    <footer class="footer">
        <p>Blue Sky</p>
        <p>Gmail: contato.bluesky@gmail.com</p>
        <p>Telefone: (41) 99985-5054</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
